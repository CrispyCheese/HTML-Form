<!DOCTYPE html>
<html lang="en">
<head>
<title>HTML Form</title>
</head>
<body>
	<form action="/action_page.php">
		<fieldset>
			<legend>Contact information:</legend>
			<table>
				<tr>
					<td align="right">
						<label for="fname">First name:</label>
						<input type="text" id="fname" name="fname" value="First name"><br>
						<label for="lname">Last name:</label>
						<input type="text" id="lname" name="lname" value="Last name"><br>
						<label for="email">Email:</label>
						<input type="email" id="email" name="email" value="Email"><br>
						<label for="phone">Telephone:</label>
						<input type="tel" id="phone" name="phone" value="Phone number">
					</td>
					<td>
						<p>Preferred contact method:</p>
							<input type="checkbox" id="contactemail" name="contactemail" value="Email">
							<label for="contactemail">Email</label><br>
							<input type="checkbox" id="contactphone" name="contactphone" value="Phone">
							<label for="contactphone">Telephone</label>
					</td>
				</tr>
			</table>
		</fieldset>
		<fieldset>
			<legend>Feedback:</legend>
				<label for="subject">Message subject:</label>
				<input type="text" id="subject" name="subject" value="Message subject"><br>
				<textarea name="message" rows="15" cols="50">
				</textarea><br>
				<label for="yourfile">Attach a file:</label>
				<input type="file" id="yourfile">
				<input type="submit" value="Send">
		</fieldset>
	</form>
</body>
</html>
